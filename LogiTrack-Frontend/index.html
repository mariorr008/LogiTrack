
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiTrack | Panel de control</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>

<body class="app-body">

  <div class="app-shell">

    <!-- BARRA LATERAL -->
    <aside class="sidebar" id="sidebar">

      <div class="brand-lockup">
        <div class="brand-mark">
          <i class="bi bi-box-seam"></i>
        </div>
        <div>
          <div class="brand-name">LogiTrack</div>
          <div class="brand-caption">INVENTORY MANAGEMENT</div>
        </div>
      </div>

      <div class="sidebar-label">MENÚ PRINCIPAL</div>

      <nav class="side-nav" id="sideNav">

        <button class="nav-link active" data-view="dashboard">
          <i class="bi bi-grid-1x2"></i>
          <span>Dashboard</span>
        </button>

        <button class="nav-link" data-view="bodegas">
          <i class="bi bi-buildings"></i>
          <span>Bodegas</span>
        </button>

        <button class="nav-link" data-view="productos">
          <i class="bi bi-box2"></i>
          <span>Productos</span>
        </button>

        <button class="nav-link" data-view="inventarios">
          <i class="bi bi-clipboard-data"></i>
          <span>Inventario</span>
        </button>

        <button class="nav-link" data-view="movimientos">
          <i class="bi bi-arrow-left-right"></i>
          <span>Movimientos</span>
        </button>

        <div class="sidebar-label sidebar-label-spaced">
          CONTROL
        </div>

        <button class="nav-link" data-view="auditorias">
          <i class="bi bi-shield-check"></i>
          <span>Auditorías</span>
        </button>

        <button class="nav-link" data-view="reportes">
          <i class="bi bi-bar-chart-line"></i>
          <span>Reportes</span>
        </button>

        <!-- NUEVO MÓDULO DE USUARIOS -->
        <button class="nav-link" data-view="usuarios" id="usuariosNav">
          <i class="bi bi-people"></i>
          <span>Usuarios</span>
        </button>

        <div class="sidebar-label sidebar-label-spaced">
          CATÁLOGOS
        </div>

        <button class="nav-link" data-view="ciudades">
          <i class="bi bi-geo-alt"></i>
          <span>Ciudades</span>
        </button>

        <button class="nav-link" data-view="marcas">
          <i class="bi bi-tags"></i>
          <span>Marcas</span>
        </button>

        <button class="nav-link" data-view="categorias">
          <i class="bi bi-bookmarks"></i>
          <span>Categorías</span>
        </button>

      </nav>

      <div class="sidebar-bottom">

        <div class="sidebar-status">
          <span class="status-dot"></span>
          API conectada por sesión
        </div>

        <button class="logout-btn" id="logoutBtn">
          <i class="bi bi-box-arrow-left"></i>
          Cerrar sesión
        </button>

      </div>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-area">

      <header class="topbar">

        <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menú">
          <i class="bi bi-list"></i>
        </button>

        <div class="topbar-context">
          <span class="eyebrow">LOGITRACK S.A.</span>
          <span class="topbar-title" id="topbarTitle">Dashboard</span>
        </div>

        <div class="topbar-right">

          <div class="api-indicator">
            <span class="status-dot"></span>
            <span>Backend</span>
          </div>

          <div class="user-chip">
            <div class="user-avatar">
              <i class="bi bi-person"></i>
            </div>

            <div>
              <strong id="userEmail">Sesión activa</strong>
              <small>Usuario autenticado</small>
            </div>
          </div>

        </div>

      </header>

      <section class="content-area">
        <div id="alertArea"></div>
        <div id="viewRoot"></div>
      </section>

      <footer class="app-footer">
        <span>© 2026 LogiTrack S.A.</span>
        <span>Gestión inteligente de inventario</span>
      </footer>

    </main>

  </div>

  <!-- MODAL GENERAL -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">

      <div class="modal-content">

        <div class="modal-header">
          <div>
            <div class="eyebrow">LOGITRACK</div>
            <h5 class="modal-title" id="modalTitle">Formulario</h5>
          </div>

          <button type="button" class="btn-close"
                  data-bs-dismiss="modal" aria-label="Cerrar">
          </button>
        </div>

        <div class="modal-body" id="modalBody"></div>

        <div class="modal-footer">

          <button class="btn btn-light" data-bs-dismiss="modal">
            Cancelar
          </button>

          <button class="btn btn-primary" id="modalSaveBtn">
            Guardar
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
